name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Breaking changes"
    labels:
      - "major"
  - title: "Features"
    labels:
      - "feature"
      - "minor"
  - title: "Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "Chores"
    labels:
      - "chore"

change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "feature"
      - "minor"
  patch:
    labels:
      - "fix"
      - "bug"
      - "chore"
  default: patch

# `major` is deliberately NOT autolabeled from title text: the autolabeler runs on
# pull_request_target, so a fork PR's author controls the title, and a label it adds is
# never removed after the title is edited -- the version-resolver would then cut a major
# release on merge. A maintainer applies `major` by hand when a change is actually
# breaking; only that label feeds the major bump.
autolabeler:
  - label: "feature"
    title:
      - '/^feat(ure)?(\(.+\))?:/i'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?:/i'
  - label: "chore"
    title:
      - '/^(chore|docs|test|ci|refactor|style)(\(.+\))?:/i'
    files:
      - "**/*.md"
      - ".github/**"

template: |
  ## What's changed

  $CHANGES
