name: ffmpeg-skill compatibility check

# Separate from ci.yml on purpose: the main test suite deliberately does
# not depend on network access to another repository (see CLAUDE.md
# "Things intentionally NOT done, and why"). This workflow runs the test
# suite against ffmpeg-skill's current main, so a release that breaks
# subtitle-skill shows up, while ordinary releases pass untouched.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run the test suite against ffmpeg-skill main
        run: python3 scripts/check_vendor_drift.py
